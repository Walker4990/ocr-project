[project]
name = "doculens-api"
version = "0.1.0"
description = "DocuLens 백엔드 API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "fastapi>=0.156.8",
    "numpy>=2.5.4",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "redis>=5.3.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["app", "tests", "../../samples"]
exclude = ["../../samples/fonts", "**/.venv"]
extraPaths = ["../../samples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests", "../../samples/tests"]
pythonpath = [".", "../../samples"]
asyncio_mode = "auto"
